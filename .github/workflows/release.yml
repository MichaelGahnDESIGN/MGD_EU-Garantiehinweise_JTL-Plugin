name: JTL-Release veröffentlichen

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Tag, Syntax, Tests und Paket prüfen
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(php -r 'echo (string)simplexml_load_file("plugin/MGD_EU_Garantiehinweise/info.xml")->Version;')" = "$version"
          find plugin -name '*.php' -print0 | xargs -0 -n1 php -l
          php -d zend.assertions=1 -d assert.exception=1 tests/run.php
          unzip -tq "dist/MGD_EU-Garantiehinweise_JTL-Plugin-$version.zip"
      - name: Stabiles GitHub-Release mit installierbarem ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="MGD_EU-Garantiehinweise_JTL-Plugin-$version.zip"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Ein vorher geprüfter Entwurf bleibt unverändert. Zeitstempel im ZIP
            # können abweichen, Dateipfade und Inhalte müssen gleich sein.
            mkdir -p "$RUNNER_TEMP/mgd-existing"
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --pattern "$package" --pattern "$package.sha256" --dir "$RUNNER_TEMP/mgd-existing"
            existing="$RUNNER_TEMP/mgd-existing/$package"
            diff -u <(unzip -Z1 "dist/$package" | sort) <(unzip -Z1 "$existing" | sort)
            while IFS= read -r entry; do
              [[ "$entry" == */ ]] && continue
              cmp <(unzip -p "dist/$package" "$entry") <(unzip -p "$existing" "$entry")
            done < <(unzip -Z1 "dist/$package")
            # Die Prüfsummen beziehen sich auf die jeweiligen ZIP-Bytes. Ein
            # anderer ZIP-Zeitstempel erzeugt trotz gleicher Dateien einen
            # anderen Hash; beide Sidecars müssen ihr eigenes ZIP bestätigen.
            (cd dist && sha256sum -c "$package.sha256")
            (cd "$RUNNER_TEMP/mgd-existing" && sha256sum -c "$package.sha256")
          else
            gh release create "$GITHUB_REF_NAME" "dist/$package" "dist/$package.sha256" \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
